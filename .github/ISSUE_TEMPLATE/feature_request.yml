name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
type: Feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is **community-supported**. Feature requests are handled on a best-effort basis and are not covered by any Palo Alto Networks support contract or SLA. There is no guarantee a request will be implemented.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the script to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried or thought about.
    validations:
      required: false

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # create release, upload assets
  id-token: write       # Sigstore keyless signing (OIDC)
  attestations: write   # record the build provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Verify SCRIPT_VERSION matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^SCRIPT_VERSION=' setup-panw-network-client.sh | cut -d'"' -f2)
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match SCRIPT_VERSION=$ver"
            exit 1
          fi
          echo "Tag and SCRIPT_VERSION agree: $ver"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: setup-panw-network-client.sh

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md)
          [ -z "$notes" ] && notes="Release ${GITHUB_REF_NAME}."
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            setup-panw-network-client.sh

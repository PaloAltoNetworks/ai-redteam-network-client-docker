name: Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "**.sh"
  pull_request:
    paths:
      - "**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run shfmt
        run: docker run --rm -v "$PWD:/work" -w /work mvdan/shfmt:v3.13.1 -d -i 2 -ci setup-panw-network-client.sh
